<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDR Telemetry 验证控制台</title>
<style>
  :root {
    --page-bg: #E1E0E6;       /* 最外层背景：浅灰，少紫 */
    --app-bg: #ECEBF0;        /* 大容器背景（浅亮，悬浮） */
    --surface: #DBDAE2;       /* 右侧卡片：只比背景深一点点 */
    --surface-2: #CDCBD6;     /* 次级按钮/滚动条 */
    --surface-light: #F2F1F5; /* 顶部信息条：比容器浅 */
    --border: #C0BFCA;        /* 边框线 */
    --divider: rgba(96,90,120,.18); /* 分割线 */
    --text: #2A2A35;          /* 主文字 */
    --label: #63626F;         /* 次要文字 */
    --label-2: #9796A3;       /* 弱化文字 */
    --primary: #5C6B84;       /* 唯一主色：蓝灰 */
    --primary-hover: #4E5C74;
    --primary-soft: #D9DEE8;  /* 蓝灰浅底 */
    --accent: #5C6B84;        /* 强调：与主色统一，色系少 */
    --accent-soft: #D9DEE8;   /* 选中态浅底 */
    --accent-deep: #3A465E;   /* 选中态深字 */
    --fill: #264F78;               /* 命中选中高亮：VSCode selection 实色深蓝，黑底上底色明显 */
    --fill-fg: #E6F0FA;           /* 命中字：浅蓝白，深蓝底上清晰 */
    --console-bg: #000000;    /* 终端：纯黑 */
    --console-text: #C5CAD3;  /* 终端浅灰字 */
    --console-dim: #6B6F78;   /* 终端暗色 */
    --match-bg: #1A1924;      /* 代码卡：深灰黑蓝（区别于纯黑） */
    --line: #2A2A35;          /* 选中项左侧线 */
    --hl-bg: rgba(92,107,132,.30);
    --hl-fg: #DCE4F5;
    --not: #9A5B6B;           /* 采集未通过（克制） */
    --pending: #9AA0AE;       /* 待测（加深，浅底上可见） */
    
    --shadow: 0 1px 2px rgba(24,22,40,.10), 0 4px 16px rgba(24,22,40,.16), 0 24px 70px rgba(24,22,40,.18);
    --shadow-card: inset 0 1px 0 rgba(255,255,255,.55), 0 1px 2px rgba(24,22,40,.08), 0 3px 12px rgba(24,22,40,.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--page-bg); color: var(--text);
    font-size: 14px; line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; align-items: center;
    overflow: hidden;
  }

  /* ===== 大容器：占 70%，高度接近全屏（可内部滚动） ===== */
  .app {
    width: 82%; max-width: 1550px;
    height: 95vh; margin: 0 auto;
    background: var(--app-bg); border-radius: 12px; box-shadow: var(--shadow);
    padding: 36px; display: flex; flex-direction: column; overflow: hidden;
  }
  .app-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; margin-bottom: 4px; flex-shrink: 0; }
  .brand { font-size: 13px; font-weight: 600; letter-spacing: 1.5px; color: var(--label); text-transform: uppercase; }
  .stats { font-size: 13px; color: var(--label); margin-left: auto; }
.about-link { margin-left: 14px; font-size: 12px; color: var(--label); text-decoration: none; border: 1px solid var(--line); padding: 1px 8px; border-radius: 4px; opacity: .8; }
.about-link:hover { opacity: 1; color: var(--text); border-color: var(--primary); }
  .stats b { color: var(--text); font-weight: 600; margin: 0 2px; }

  .layout { flex: 1; display: flex; gap: 24px; min-height: 0; overflow: hidden; }

  /* ===== 主页：模块树左侧占比与详情页一致（30%），右侧一张充满的占位卡 ===== */
  .sidebar {
    flex: 0 0 30%; width: 30%; min-width: 0;
    overflow-y: auto; display: flex; flex-direction: column;
    transition: flex-basis .3s ease, width .3s ease;
  }
  /* 详情页：模块树占比 30%，右侧主区占据剩余 70%，左右之间加淡色分割线 */
  .layout.mode-detail .sidebar { flex: 0 0 30%; width: 30%; border-right: 1px solid var(--divider); padding-right: 24px; }

  .ov-title { font-size: 20px; font-weight: 600; margin: 2px 0 6px; color: var(--text); }
  .ov-sub { font-size: 13px; color: var(--label); margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--divider); }

  .module-head {
    display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 12px;
    cursor: default; font-size: 18px; font-weight: 600; color: var(--text);
    border-radius: 10px; user-select: none;
  }
  .module-head .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .module-head .count { color: var(--label); font-size: 14px; }
  .arrow { display: inline-flex; color: var(--label); transition: transform .15s ease, background .12s ease, color .12s ease; cursor: pointer; padding: 5px; border-radius: 6px; }
  .arrow:hover { color: var(--text); background: var(--surface-2); }
  .arrow svg { width: 16px; height: 16px; }
  .arrow.open { transform: rotate(90deg); color: var(--accent-deep); }
  .case-list { padding: 2px 0 10px 18px; }
  .case-list.closed { display: none; }
  .case-item {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px 12px 18px;
    cursor: pointer; font-size: 15px; color: var(--text); border-radius: 10px;
    border-left: 4px solid transparent; border-bottom: 1px solid rgba(120,115,150,.14);
  }
  .case-item:last-child { border-bottom: none; }
  .case-item:hover { background: var(--surface); }
  .case-item.active .label { font-weight: 700; color: var(--accent-deep); }
  .case-item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .case-item .case-status { font-size: 13px; flex-shrink: 0; font-weight: 600; }
  .case-item .case-status.c { color: #3B82F6; }
  .case-item .case-status.n { color: #B04A5C; }
  .case-item .case-status.p { color: #A6ADBB; }
  .case-item .case-status.w { color: #C9A227; }
  .case-item .tested { font-size: 11px; flex-shrink: 0; padding: 1px 7px; border-radius: 4px; background: var(--surface-2); color: var(--label); }
  .sdot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .sdot.c { background: #3B82F6; }   /* 采集通过：亮蓝 */
  .sdot.n { background: #B04A5C; }   /* 采集未通过：亮红 */
  .sdot.p { background: #A6ADBB; }   /* 待测：中灰 */
  .sdot.w { background: #C9A227; }   /* 部分采集：黄 */

  /* 详情页侧栏与主页同风格（大字大选项，不缩小） */

  /* ===== 详情主区 ===== */
  .main { display: none; flex-direction: column; gap: 16px; flex: 1; min-width: 0; overflow-y: auto; }
  .layout.mode-detail .main { display: flex; }

  /* 主页右侧：一张充满的占位卡（固定，不滚动） */
  .overview-side { flex: 1; min-width: 0; display: flex; }
  .layout.mode-detail .overview-side { display: none; }
  .summary-panel {
    flex: 1; min-height: 0; overflow-y: auto;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--surface); padding: 20px 24px;
  }
  .sum-stats { display: flex; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
  .sum-stat { font-size: 13px; color: var(--label); display: flex; align-items: center; gap: 6px; }
  .sum-stat b { color: var(--text); }
  .sum-list { display: flex; flex-direction: column; gap: 2px; }
  .sum-module { font-size: 12px; font-weight: 600; color: var(--label); letter-spacing: .5px; margin: 12px 0 4px; }
  .sum-row { display: flex; align-items: baseline; gap: 8px; padding: 4px 6px; border-radius: 6px; font-size: 13px; flex-wrap: wrap; }
  .sum-row:hover { background: var(--accent-soft); }
  .sum-name { color: var(--text); }
  .sum-note { color: var(--label); font-size: 12px; flex-basis: 100%; margin-left: 14px; }

  .card { background: var(--surface); border-radius: 10px; padding: 20px 24px; width: 100%; flex-shrink: 0; box-shadow: var(--shadow-card); }
  .card h3 { font-size: 16px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }

  .info-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--surface-light); border-radius: 10px; padding: 12px 22px; width: 100%;
    box-shadow: var(--shadow-card);
  }
  .info-bar .cid { font-size: 17px; font-weight: 700; }
  .info-bar .sep { width: 1px; height: 18px; background: var(--divider); flex-shrink: 0; }
  .info-bar .meta { font-size: 14px; color: var(--label); }
  .info-bar .vtag { font-size: 13px; font-weight: 600; color: var(--accent-deep); }
  .badge { font-size: 12px; padding: 3px 12px; border-radius: 999px; font-weight: 600; }
  .badge.c { background: var(--primary-soft); color: var(--primary); }
  .badge.w { background: #F2E7D0; color: var(--partial); }
  .badge.n { background: #ECDADD; color: var(--not); }
  .badge.p { background: #E3E2EA; color: var(--label); }
  .info-bar .spacer { flex: 1; }
  .toggle { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--label); cursor: pointer; }
  .log-row { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); align-items: center; font-size: 13px; }
  .log-row label { flex: 1; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
  .log-row .time { color: var(--label); font-size: 12px; }
  .log-confirm { position: sticky; top: 0; z-index: 40; }
  .log-err { font-size: 13px; color: var(--not); background: #F0E4E8; border-radius: 8px; padding: 10px 14px; margin: 6px 0 12px; }
  .log-btns { display: flex; gap: 12px; margin-top: 14px; }
  /* 日志确认：搜索栏式窄条，面板可滚动/展开收起 */
  .log-bar-wrap { position: sticky; top: 0; z-index: 40; }
  .log-bar {
    background: var(--surface-light); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; display: flex; align-items: center; gap: 10px;
    box-shadow: var(--shadow-card);
  }
  .log-trigger { flex: 1; cursor: pointer; font-size: 13px; color: var(--text); display: flex; align-items: center; gap: 8px; min-width: 0; }
  .log-trigger .lt-label { color: var(--label); flex-shrink: 0; }
  .log-trigger .lt-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--accent-deep); font-weight: 600; }
  .log-trigger .lt-time { color: var(--label); font-size: 12px; flex-shrink: 0; }
  .log-trigger .caret { flex-shrink: 0; color: var(--label); transition: transform .15s ease; }
  .log-trigger .caret.open { transform: rotate(90deg); }
  .log-panel { display: none; max-height: 150px; overflow: auto; margin-top: 8px; border-top: 1px solid var(--border); padding: 6px 10px; background: var(--app-bg); border-radius: 0 0 10px 10px; box-shadow: var(--shadow-card); }
  .log-panel.open { display: block; }
  /* 代码卡 header 版本下拉 */
  .code-head .code-lbl { font-size: 12px; color: var(--console-dim); flex-shrink: 0; }
  .code-head select {
    background: rgba(255,255,255,.07); border: 1px solid #2C2C38; color: var(--console-text);
    height: 30px; border-radius: 6px; font-size: 12px; padding: 0 8px; font-family: inherit;
    max-width: 220px; cursor: pointer;
  }
  .code-head select:focus { outline: none; border-color: var(--accent); }
  /* 右键菜单 */
  .ctx-menu {
    display: none; position: fixed; z-index: 100; min-width: 240px;
    background: var(--app-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 6px; box-shadow: 0 2px 20px rgba(24,22,40,.22);
  }
  .ctx-menu.open { display: block; }
  .ctx-title { font-size: 12px; color: var(--label); padding: 4px 10px 8px; border-bottom: 1px solid var(--divider); margin-bottom: 6px; }
  .ctx-row { font-size: 13px; padding: 6px 10px; border-radius: 7px; display: flex; justify-content: space-between; gap: 14px; }
  .ctx-row .k { color: var(--label); }
  .ctx-row .v { color: var(--text); font-family: "JetBrains Mono", Consolas, monospace; font-size: 12px; }
  .ctx-item { font-size: 13px; padding: 8px 10px; border-radius: 7px; cursor: pointer; color: var(--text); }
  .ctx-item:hover { background: var(--surface-2); }

  button {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    height: 40px; padding: 0 18px; border-radius: 12px; cursor: pointer;
    font-size: 14px; font-family: inherit; font-weight: 500; white-space: nowrap;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 1px 2px rgba(24,22,40,.10);
  }
  button:hover { background: var(--border); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary {
    background: linear-gradient(180deg, var(--primary), var(--primary-hover));
    border-color: var(--primary-hover); color: #fff; padding: 0 24px; font-weight: 600;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 2px 6px rgba(24,22,40,.20);
  }
  button.primary:hover { background: linear-gradient(180deg, var(--primary-hover), var(--primary-hover)); }

  /* 按钮独立成排：执行样本 + 匹配 + 加号下拉，紧凑靠左 */
  .btn-row { display: flex; gap: 12px; width: 100%; align-items: center; }
  .plus-wrap { position: relative; flex: none; }
  /* 加号：微信式图标，hover 背景加深，不是按钮 */
  .plus-ico {
    width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
    border-radius: 8px; cursor: pointer; color: var(--label);
    transition: background .12s ease, color .12s ease;
  }
  .plus-ico:hover { background: var(--surface-2); color: var(--text); }
  .plus-ico svg { width: 20px; height: 20px; }
  .plus-menu {
    display: none; position: absolute; top: calc(100% + 8px); right: 0;
    min-width: 170px; background: var(--app-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 6px; z-index: 60;
    box-shadow: 0 2px 16px rgba(24,22,40,.18);
  }
  .plus-menu.open { display: block; }
  .plus-item { padding: 10px 14px; font-size: 14px; border-radius: 7px; cursor: pointer; color: var(--text); }
  .plus-item:hover { background: var(--surface-2); }

  .console {
    background: var(--console-bg); color: var(--console-text);
    font-family: "JetBrains Mono", "SF Mono", Consolas, Menlo, monospace;
    font-size: 15px; line-height: 1.85; border-radius: 10px;
    padding: 24px; height: 65vh; overflow-y: auto;
    white-space: pre-wrap; word-break: break-all;
  }
  .console.console-sm { height: 40vh; }
  .console .err { color: #f0b3c0; }
  .console .warn { color: #e6d7a8; }
  .console .dim { color: var(--console-dim); }

  /* ===== 批量终端：每个 case 一张卡片，实时跳到正在跑的 case ===== */
  .console.batch { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .batch-term { border: 1px solid #2C2C38; border-radius: 8px; background: #0B0B10; overflow: hidden; flex-shrink: 0; }
  .batch-term.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .batch-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #15151C; border-bottom: 1px solid #2C2C38; }
  .batch-cid { font-size: 13px; font-weight: 600; color: var(--console-text); }
  .batch-st { font-size: 12px; font-weight: 600; margin-left: auto; }
  .batch-st.running { color: #7FB3FF; }
  .batch-st.ok { color: #7BD88F; }
  .batch-st.fail { color: #f0b3c0; }
  .batch-pre { margin: 0; padding: 10px 14px; font-family: "JetBrains Mono", Consolas, monospace; font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-all; color: var(--console-text); max-height: 300px; overflow-y: auto; }
  .batch-pre .err { color: #f0b3c0; } .batch-pre .warn { color: #e6d7a8; } .batch-pre .dim { color: var(--console-dim); }
  /* 匹配逻辑进终端 */
  .match-log { margin-top: 12px; border: 1px solid var(--accent); border-radius: 8px; background: rgba(92,107,132,.12); padding: 10px 14px; font-size: 13px; color: var(--console-text); }
  .match-log-head { font-weight: 600; margin-bottom: 6px; color: var(--accent); }
  .case-status.running { color: #3B82F6; }

  .run-ind { font-size: 13px; font-weight: 500; color: var(--label); }
  .run-ind.running { color: var(--accent); }
.stop-btn { height: 26px; padding: 0 14px; font-size: 13px; margin-left: 8px; background: var(--not); border-color: var(--not); color: #fff; }
.stop-btn:hover { background: #9c3b48; border-color: #9c3b48; }

  .panel-match {
    min-height: 65vh; background: var(--match-bg); color: var(--console-text);
  }
  .panel-match h3 { color: var(--console-text); }
  .panel-match .muted { color: var(--console-dim); }
  .panel-match .mi .k { color: var(--console-dim); }
  .panel-match .mi .v { color: var(--console-text); }
  .panel-match .prog-label { color: var(--console-dim); }
  .panel-match .bar-wrap { background: #2A2D34; }
  .panel-match .f-name { color: var(--console-dim); }
  .match-msg { font-size: 13px; color: var(--console-dim); background: rgba(255,255,255,.05); border-left: 3px solid var(--accent); padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; }
  .f-val.dim { color: var(--console-dim); }
  .funnel { font-size: 13px; color: var(--console-dim); margin: 12px 0 6px; }
  .funnel .k2 { color: var(--console-text); font-weight: 600; margin-right: 8px; }
  .obs { font-size: 13px; color: var(--console-dim); margin-bottom: 10px; }
  .filter-log { margin-top: 14px; }
  .fl-btn { height: 32px; padding: 0 12px; font-size: 13px; background: rgba(255,255,255,.06); border: 1px solid var(--border); color: var(--console-text); }
  .fl-box { display: none; margin-top: 8px; font-size: 12px; color: var(--console-dim); font-family: "JetBrains Mono", Consolas, monospace; line-height: 1.7; background: rgba(0,0,0,.28); border-radius: 8px; padding: 12px 14px; white-space: pre-wrap; word-break: break-all; }
  .fl-box.open { display: block; }
  /* ===== 匹配代码卡（VSCode 风格：行号 + 选中式高亮） ===== */
  .panel-code {
    min-height: 70vh;
    background: #101018; color: var(--console-text);
    display: flex; flex-direction: column;
    border-radius: 10px; padding: 0; overflow: hidden;
  }
  .panel-code .code-head {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 18px; border-bottom: 1px solid #23232E;
  }
  .panel-code .code-head .spacer { flex: 1; }
  .panel-code .code-verdict { font-size: 14px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
  .panel-code .code-verdict.v2-ok { color: #7BD88F; }
  .panel-code .code-verdict.v2-bad { color: #f0b3c0; }
  .panel-code .code-verdict.v2-wait { color: #e6d7a8; }
  .panel-code .code-stats { font-size: 13px; color: var(--console-dim); }
  .panel-code .code-msg {
    display: none; font-size: 13px; color: var(--console-dim);
    padding: 10px 18px; border-bottom: 1px solid #23232E;
    background: rgba(255,255,255,.04);
  }
  .panel-code .code-msg.show { display: block; }
  .panel-code pre.stdout {
    flex: 1; margin: 0;
    background: #101018; color: var(--console-text);
    font-family: "JetBrains Mono", Consolas, monospace; font-size: 13px; line-height: 1.8;
    padding: 16px 20px; overflow: auto;
    white-space: pre; counter-reset: line;
  }
  .panel-code pre.stdout span.line { display: block; white-space: pre; }
  .panel-code pre.stdout span.line::before {
    content: counter(line); counter-increment: line;
    display: inline-block; width: 38px; margin-right: 16px; text-align: right;
    color: #565B66; user-select: none;
  }
  .panel-code pre.stdout .hl { background: var(--fill); border-radius: 3px; color: var(--fill-fg); }
  .panel-code pre.stdout .found { background: var(--fill); border-radius: 3px; color: var(--fill-fg); }
  .panel-code pre.stdout .miss { background: transparent; color: var(--console-dim); opacity: .75; }
  .panel-code .fl-btn {
    height: 30px; padding: 0 12px; font-size: 12px;
    background: rgba(255,255,255,.06); border: 1px solid #2C2C38; color: var(--console-text);
    border-radius: 6px;
  }
  .panel-code .fl-btn:hover { background: rgba(255,255,255,.12); }
  .panel-code .fl-panel {
    display: none; max-height: 260px; overflow: auto;
    padding: 12px 18px; border-bottom: 1px solid #23232E;
    font-family: "JetBrains Mono", Consolas, monospace; font-size: 12px;
    color: var(--console-dim); background: rgba(0,0,0,.25);
  }
  .panel-code .fl-panel.open { display: block; }
  .panel-code .fl-panel div { padding: 2px 0; }
  .panel-code .fl-panel .anomaly {
    color: #f0b3c0; padding: 6px 0; font-family: inherit; font-size: 13px;
  }
  .match-head { display: flex; gap: 24px; flex-wrap: wrap; }

  .progress { margin: 18px 0; }
  .bar-wrap { height: 9px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .bar { height: 100%; background: var(--accent); border-radius: 4px; }
  .match-fields { display: flex; flex-direction: column; gap: 10px; }
  .field-row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .f-name { color: var(--label); width: 130px; flex-shrink: 0; }
  .f-val { font-family: "JetBrains Mono", Consolas, monospace; font-size: 13px; }
  .f-val.hl { background: rgba(96,122,168,.30); color: #CFD8EC; border-radius: 4px; padding: 2px 8px; font-weight: 600; }
  .muted { color: var(--label); }

  /* 映射卡片 */
  .panel-map .map-body { padding: 10px 12px; font-size: 13px; }
  .map-sub { font-weight: 600; margin: 8px 0 4px; color: var(--label); font-size: 12px; }
  .map-sub:first-child { margin-top: 0; }
  .map-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .map-k { min-width: 130px; color: #d7ba7d; font-family: Consolas, monospace; flex-shrink: 0; }
  .map-arrow { color: var(--console-dim); }
  .map-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .map-tag { background: var(--surface-2); border: 1px solid var(--border); padding: 1px 7px; border-radius: 3px; font-size: 11px; color: #9cdcfe; font-family: Consolas, monospace; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border); }
</style>

<body>
<div class="app">
  <header class="app-head">
    <div class="brand">EDR Telemetry</div>
    <a class="about-link" href="/summary.html" title="查看采集能力结果总结">结果总结</a>
    <a class="about-link" href="/about.html" target="_blank" title="关于本项目">关于</a>
    <div class="stats" id="headStats"></div>
  </header>
  <div class="layout mode-overview" id="layout">
    <aside class="sidebar" id="sidebar">
      <div class="ov-title">概览</div>
      <div class="ov-sub" id="ovSub"></div>
      <div id="tree"></div>
    </aside>
    <section class="overview-side">
      <div class="summary-panel" id="summaryPanel"></div>
    </section>
    <main class="main" id="main"></main>
  </div>
</div>

<script>
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
let currentCase = null, selectedJson = null, viewMode = 'run';
let isRunning = false;    /* 运行锁：任务进行中禁用「执行样本/匹配」按钮 */
let activeStream = null;  /* 全局 SSE 句柄：切换 case 不关闭，仅新任务前替换 */

function setRunning(running) { isRunning = running; applyRunLock(); }
function applyRunLock() {
  const runBtn = $('#runBtn'), matchBtn = $('#matchBtn');
  for (const b of [runBtn, matchBtn]) {
    if (!b) continue;
    b.disabled = isRunning;
    b.style.opacity = isRunning ? '.55' : '';
    b.style.cursor = isRunning ? 'not-allowed' : '';
  }
}

function el(tag, attrs={}, text='') { const n = document.createElement(tag); Object.assign(n, attrs); if (text !== '') n.textContent = text; return n; }

/* 模块/样本 中文映射 */
const MOD_CN = {
  'BIT JOBS': 'BIT 任务', 'Device Operations': '设备操作', 'Driver/Module Activity': '驱动/模块活动',
  'EDR SysOps': 'EDR 系统运维', 'File': '文件', 'Hash': '哈希', 'Named Pipe': '命名管道',
  'Network': '网络', 'Other': '其他', 'PowerShell': 'PowerShell', 'Process': '进程',
  'Registry': '注册表', 'Schedule Task': '计划任务', 'Service': '服务',
  'User Account': '用户账户', 'WMI': 'WMI', 'Account': '账户', 'Driver': '驱动', 'ScheduleTask': '计划任务'
};
const SAMPLE_CN = {
  'RegistryLifecycleTest.exe': '注册表生命周期测试', 'ImageLoadTest.exe': '镜像加载测试',
  'ProcessLifecycleTest.exe': '进程生命周期测试', 'FileLifecycleTest.exe': '文件生命周期测试',
  'AccountLifecycleTest.exe': '账户生命周期测试', 'NetworkActivityTest.exe': '网络活动测试',
  'HashBaselineTool.exe': '哈希基线工具', 'DriverLifecycleTest.exe': '驱动生命周期测试',
  'ScheduledTaskLifecycleTest.exe': '计划任务生命周期测试', 'ServiceLifecycleTest.exe': '服务生命周期测试'
};
const modCn = d => MOD_CN[d] || d || '';
const sampleCn = p => SAMPLE_CN[p] || p || '';

/* case 行为中文名（53 项，与 overview 的 case_id 一一对应） */
const CASE_CN = {
  'BIT-JOB-001': 'BIT 任务活动',
  'DEVICE-USB-MOUNT-001': 'USB 设备挂载', 'DEVICE-USB-UNMOUNT-001': 'USB 设备卸载', 'DEVICE-VDISK-MOUNT-001': '虚拟磁盘挂载',
  'DRIVER-LOAD-001': '驱动加载', 'DRIVER-MODIFY-001': '驱动修改', 'DRIVER-UNLOAD-001': '驱动卸载',
  'AGENT-ERROR-001': 'Agent 错误', 'AGENT-INSTALL-001': 'Agent 安装', 'AGENT-KEEPALIVE-001': 'Agent 保活',
  'AGENT-START-001': 'Agent 启动', 'AGENT-STOP-001': 'Agent 停止', 'AGENT-UNINSTALL-001': 'Agent 卸载',
  'FILE-CREATE-001': '文件创建', 'FILE-DELETE-001': '文件删除', 'FILE-MODIFY-001': '文件修改',
  'FILE-OPEN-001': '文件打开', 'FILE-RENAME-001': '文件重命名',
  'HASH-IMPHASH-001': 'IMPHASH', 'HASH-MD5-001': 'MD5', 'HASH-SHA-001': 'SHA',
  'PIPE-CONNECT-001': '管道连接', 'PIPE-CREATE-001': '管道创建',
  'NET-DNS-001': 'DNS 查询', 'NET-DOWNLOAD-001': '文件下载', 'NET-TCP-001': 'TCP 连接',
  'NET-UDP-001': 'UDP 连接', 'NET-URL-001': 'URL 访问',
  'GPO-MODIFY-001': '组策略修改', 'PS-BLOCK-001': '脚本块活动',
  'PROC-ACCESS-001': '进程访问', 'PROC-CREATE-001': '进程创建', 'PROC-IMAGE-LOAD-001': '镜像/库加载',
  'PROC-REMOTE-THREAD-001': '远程线程创建', 'PROC-TAMPER-001': '进程篡改', 'PROC-TERMINATE-001': '进程终止',
  'REG-CREATE-001': '键/值创建', 'REG-DELETE-001': '键/值删除', 'REG-MODIFY-001': '键/值修改',
  'TASK-CREATE-001': '计划任务创建', 'TASK-DELETE-001': '计划任务删除', 'TASK-MODIFY-001': '计划任务修改',
  'SVC-CREATE-001': '服务创建', 'SVC-DELETE-001': '服务删除', 'SVC-MODIFY-001': '服务修改',
  'ACCOUNT-CREATE-001': '本地账户创建', 'ACCOUNT-DELETE-001': '本地账户删除', 'ACCOUNT-LOGIN-001': '账户登录',
  'ACCOUNT-LOGOFF-001': '账户注销', 'ACCOUNT-MODIFY-001': '本地账户修改',
  'WMI-CONSUMER-TO-FILTER-001': '事件消费者绑定', 'WMI-CONSUMER-001': '事件消费者', 'WMI-FILTER-001': '事件过滤器'
};
const caseCn = id => CASE_CN[id] || id;

/* verdict 中文（不显示 emoji icon） */
const VERDICT_CN = {
  'IMPLEMENTED': '已实现', 'PARTIALLY_IMPLEMENTED': '部分实现', 'NOT_IMPLEMENTED': '未实现',
  'PENDING': '未判定', 'VIA_WINDOWS_EVENTLOG': 'Windows 事件日志',
  'ERROR_SAMPLE': '样本错误', 'ERROR_LOG_INPUT': '日志输入错误', 'AMBIGUOUS': '匹配歧义'
};

/* 前端本地测试记录：已测状态 + 时间 + 终端日志（localStorage） */
function getHistory() {
  try { return JSON.parse(localStorage.getItem('edr-test-history') || '{}'); } catch (e) { return {}; }
}
function saveHistory(caseId, kind, logHtml) {
  const h = getHistory();
  const prev = h[caseId] || {};
  h[caseId] = {
    kind: kind,
    time: new Date().toLocaleString('zh-CN', { hour12: false }),
    log: String(logHtml || '').slice(-300000),
    verdict: prev.verdict || null
  };
  try { localStorage.setItem('edr-test-history', JSON.stringify(h)); } catch (e) {}
}
function saveHistoryVerdict(caseId, verdict) {
  const h = getHistory();
  if (h[caseId]) { h[caseId].verdict = verdict; try { localStorage.setItem('edr-test-history', JSON.stringify(h)); } catch (e) {} }
}

let OVERVIEW = null;
let INDUSTRY = null;
function moduleCaseCount(module) {
  if (!OVERVIEW) return 0;
  const m = OVERVIEW.modules.find(x => x.module === module);
  return m ? m.cases.filter(c => c.integrated).length : 0;
}
function totalIntegratedCases() {
  if (!OVERVIEW) return 0;
  return OVERVIEW.modules.reduce((n, m) => n + m.cases.filter(c => c.integrated).length, 0);
}
function normalizeOverview(data) {
  let collected = 0, not_collected = 0, pending = 0;
  for (const m of data.modules) for (const c of m.cases) {
    const b = c.binary;
    if (b !== '采集通过' && b !== '采集未通过') {
      const rv = c.result && c.result.verdict;
      c.binary = (rv === '对') ? '采集通过' : (rv === '错') ? '采集未通过' : (b || '待判定');
    }
    if (c.binary === '采集通过') collected++;
    else if (c.binary === '采集未通过') not_collected++;
    else pending++;
  }
  data.summary = { total: (data.summary && data.summary.total) || 0, collected, not_collected, pending };
  return data;
}

function caseBinaryOf(cid) {
  for (const m of (OVERVIEW ? OVERVIEW.modules : [])) {
    const c = m.cases.find(x => x.case_id === cid);
    if (c) return c.binary;
  }
  return null;
}

async function loadOverview(autoSelect = true) {
  const data = normalizeOverview(await (await fetch('/api/overview')).json());
  OVERVIEW = data;
  renderTree(data.modules);
  renderOverview(data);
  if (autoSelect) {
    // 初始加载：默认直接进入第一个已接入的行为
    autoSelectFirst(data.modules);
  } else if (currentCase) {
    // 任务结束刷新：保持当前选中，不跳回第一个
    const it = $$('.case-item').find(i => i.querySelector('.label') && i.querySelector('.label').textContent === caseCn(currentCase.case_id));
    if (it) { $$('.case-item.active').forEach(x => x.classList.remove('active')); it.classList.add('active'); }
  }
  fetch('/api/industry').then(r => r.json()).then(d => { INDUSTRY = d; renderSummary(data); }).catch(() => {});
}

function autoSelectFirst(modules) {
  for (const m of modules) {
    for (const c of m.cases) {
      if (!c.integrated) continue;
      const it = $$('.case-item').find(i => i.querySelector('.label') && i.querySelector('.label').textContent === caseCn(c.case_id));
      if (it) { $$('.case-item.active').forEach(x => x.classList.remove('active')); it.classList.add('active'); }
      selectCase(c);
      return;
    }
  }
}

function renderTree(modules) {
  const tree = $('#tree'); tree.innerHTML = '';
  for (const m of modules) {
    const head = el('div', {className: 'module-head'});
    head.appendChild(el('span', {className: 'name'}, modCn(m.display)));
    head.appendChild(el('span', {className: 'count'}, m.cases.length));
    const arr = el('span', {className: 'arrow open'});
    arr.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
    head.appendChild(arr);
    const list = el('div', {className: 'case-list'});
    arr.onclick = (e) => { e.stopPropagation(); list.classList.toggle('closed'); arr.classList.toggle('open'); };
    for (const c of m.cases) {
      const item = el('div', {className: 'case-item' + (c.integrated ? '' : ' reserved')});
      const cls = c.binary === '采集通过' ? 'c' : (c.binary === '采集未通过' ? 'n' : 'p');
      item.appendChild(el('span', {className: 'sdot ' + cls}));
      item.appendChild(el('span', {className: 'label'}, caseCn(c.case_id)));
      const st = c.binary || '—';
      item.appendChild(el('span', {className: 'case-status ' + cls}, st));
      item.onclick = () => {
        $$('.case-item.active').forEach(x => x.classList.remove('active'));
        item.classList.add('active');
        selectCase(c);
      };
      list.appendChild(item);
    }
    tree.appendChild(head); tree.appendChild(list);
  }
}

function renderOverview(data) {
  const s = data.summary, mods = data.modules;
  let integrated = 0, total = 0;
  for (const m of mods) for (const c of m.cases) { total++; if (c.integrated) integrated++; }
  $('#ovSub').textContent = mods.length + ' 模块 · ' + total + ' 用例 · 已接入 ' + integrated;
  const hs = $('#headStats'); hs.innerHTML = '';
  hs.append(document.createTextNode('采集通过 '), el('b', {}, String(s.collected)),
           document.createTextNode(' · 采集未通过 '), el('b', {}, String(s.not_collected)));
  renderSummary(data);
}

function fmtSituations(sit) {
  if (!sit || typeof sit !== 'object') return '';
  const parts = [];
  for (const k of ['有记录', '无记录']) {
    const arr = sit[k];
    if (Array.isArray(arr) && arr.length) parts.push(k + '：' + arr.join('、'));
  }
  return parts.join('；');
}

function renderSummary(data) {
  const panel = $('#summaryPanel');
  if (!panel) return;
  panel.innerHTML = '';
  const s = data.summary;
  const stats = el('div', {className: 'sum-stats'});
  const mk = (cls, label, n) => {
    const b = el('span', {className: 'sum-stat'});
    b.appendChild(el('span', {className: 'sdot ' + cls}));
    b.appendChild(document.createTextNode(label + ' '));
    b.appendChild(el('b', {}, String(n)));
    stats.appendChild(b);
  };
  mk('c', '采集通过', s.collected);
  mk('n', '采集未通过', s.not_collected);
  panel.appendChild(stats);
  const list = el('div', {className: 'sum-list'});
  for (const m of data.modules) {
    list.appendChild(el('div', {className: 'sum-module'}, modCn(m.display)));
    for (const c of m.cases) {
      const row = el('div', {className: 'sum-row'});
      const cls = c.binary === '采集通过' ? 'c' : (c.binary === '采集未通过' ? 'n' : 'p');
      row.appendChild(el('span', {className: 'sdot ' + cls}));
      const nameEl = el('span', {className: 'sum-name'}, caseCn(c.case_id));
      const cat = INDUSTRY && INDUSTRY.case_map ? INDUSTRY.case_map[c.case_id] : null;
      const ind = cat && INDUSTRY.categories ? INDUSTRY.categories[cat] : null;
      if (ind) {
        const arr = [];
        for (const p of ['Sysmon', 'MDE', 'CrowdStrike', 'SentinelOne']) arr.push(p + '=' + (ind[p] || '?'));
        nameEl.title = '[' + cat + '] ' + arr.join('  ');
      }
      row.appendChild(nameEl);
      const rv = (c.result && c.result.verdict) || '';
      if (rv) row.appendChild(el('span', {className: 'badge ' + cls}, rv + (c.result && c.result.uncertain ? '?' : '')));
      const cause = [c.result && c.result.note, fmtSituations(c.result && c.result.situations)].filter(Boolean).join('｜');
      if (cause) row.appendChild(el('span', {className: 'sum-note', title: cause}, cause));
      list.appendChild(row);
    }
  }
  panel.appendChild(list);
}

function selectCase(c) {
  currentCase = c;
  selectedJson = null;
  viewMode = 'match';
  $('#layout').classList.remove('mode-overview');
  $('#layout').classList.add('mode-detail');
  renderView(c);
}

function switchView(v) {
  if (!currentCase || viewMode === v) return;
  viewMode = v;
  renderView(currentCase);
}

function renderView(c) {
  const main = $('#main');
  main.innerHTML = '';
  main.appendChild(buildInfoBar(c));
  main.appendChild(buildButtonRow(c));
  if (viewMode === 'run') {
    main.appendChild(buildTerminal(false));
  } else {
    main.appendChild(buildCodeCard());        // 匹配：结果卡（verdict + stdout）优先
    main.appendChild(buildSampleLogCard());   // 样本日志（命中的 IOA 事件）
    main.appendChild(buildTerminal(false));   // 匹配日志终端（流式匹配逻辑）
    loadStdout(c);
    fillVersionSelects(c);
    refreshMatch(c);
  }
  applyRunLock();
}

function buildInfoBar(c) {
  const bar = el('div', {className: 'info-bar'});
  bar.appendChild(el('span', {className: 'cid'}, c.case_id));
  const cls = c.binary === '采集通过' ? 'c' : (c.binary === '采集未通过' ? 'n' : 'p');
  const txt = c.binary || '—';
  bar.appendChild(el('span', {className: 'badge ' + cls}, txt));
  bar.appendChild(el('span', {className: 'sep'}));
  bar.appendChild(el('span', {className: 'meta'}, modCn(c.module)));
  if (c.program) bar.appendChild(el('span', {className: 'meta'}, sampleCn(c.program)));
  if (c.result && c.result.verdict) {
    const rv = c.result.verdict;
    const rc = rv === '对' ? 'c' : (rv === '错' ? 'n' : (rv === '疑问' ? 'w' : 'p'));
    const rtxt = rv + (c.result.uncertain ? '?' : '');
    bar.appendChild(el('span', {className: 'sep'}));
    bar.appendChild(el('span', {className: 'badge ' + rc, title: c.result.note || ''}, rtxt));
  }
  return bar;
}

/* 按钮独立成排：执行样本 + 匹配均分，右侧加号下拉（导入日志/更新样本） */
function buildButtonRow(c) {
  const row = el('div', {className: 'btn-row'});
  if (!c.integrated) {
    row.appendChild(el('span', {className: 'muted'}, '预留模块，样本未接入'));
    return row;
  }
  const runBtn = el('button', {className: 'primary', id: 'runBtn'}, '执行样本');
  runBtn.onclick = () => { if (isRunning) return; switchView('run'); runTask('run'); };
  const matchBtn = el('button', {className: 'primary', id: 'matchBtn'}, '匹配');
  matchBtn.onclick = async () => {
    if (isRunning) return;
    switchView('match');
    const ok = await confirmLog();
    if (ok && !isRunning) {
      runTask('match');
      $('#main').scrollTo({ top: 0, behavior: 'smooth' });
    }
  };
  const wrap = el('div', {className: 'plus-wrap'});
  const plusBtn = el('div', {className: 'plus-ico'});
  plusBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 19V5M5 12h14"/></svg>';
  const menu = el('div', {className: 'plus-menu'});
  const mkItem = (label, fn) => {
    const it = el('div', {className: 'plus-item'}, label);
    it.onclick = () => { menu.classList.remove('open'); fn(); };
    menu.appendChild(it);
  };
  mkItem('导入日志', () => {
    const inp = el('input', {type: 'file', accept: '.json,.zip', multiple: true, style: 'display:none'});
    document.body.appendChild(inp);
    inp.onchange = () => {
      if (!inp.files.length) { inp.remove(); return; }
      const fd = new FormData();
      for (const f of inp.files) fd.append('file', f, f.name);
      fetch(`/api/case/${currentCase.case_id}/logupload`, {method: 'POST', body: fd})
        .then(r => r.json())
        .then(d => {
          const box = $('#console');
          if (box) box.appendChild(el('div', {className: 'dim'}, d.error ? ('导入失败：' + d.error) : '已导入：' + (d.saved || []).map(x => x.split(/[\\/]/).pop()).join(', ')));
        });
      inp.remove();
    };
    inp.click();
  });
  mkItem('更新样本', showSampleUpload);
  mkItem('批量投递本模块', () => {
    if (!currentCase) return;
    fetch(`/api/module/${currentCase.module}/deliver`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'})
      .then(r => r.json())
      .then(d => {
        if (!d.task_id) return;
        switchView('run');
        const box = $('#console');
        if (box) { box.innerHTML = ''; box.appendChild(el('span', {className: 'dim'}, '模块批量投递任务已提交')); streamTask(d.task_id, 'run', currentCase, moduleCaseCount(currentCase.module)); }
      });
  });
  mkItem('全量投递', () => {
    fetch('/api/all/deliver', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'})
      .then(r => r.json())
      .then(d => {
        if (!d.task_id) return;
        switchView('run');
        const box = $('#console');
        if (box) { box.innerHTML = ''; box.appendChild(el('span', {className: 'dim'}, '全量投递任务已提交')); streamTask(d.task_id, 'run', currentCase, totalIntegratedCases()); }
      });
  });
  plusBtn.onclick = (e) => { e.stopPropagation(); menu.classList.toggle('open'); };
  document.addEventListener('click', () => menu.classList.remove('open'));
  wrap.append(plusBtn, menu);
  const matchAllBtn = el('button', {className: 'primary', id: 'matchAllBtn'}, '一键匹配全部');
  matchAllBtn.onclick = () => { runMatchAll(); };
  row.append(runBtn, matchBtn, matchAllBtn, wrap);
  return row;
}

function buildTerminal(compact) {
  const term = el('div', {className: 'card panel-term'});
  const th = el('h3', {});
  th.appendChild(document.createTextNode('终端 '));
  th.appendChild(el('span', {className: 'run-ind', id: 'runInd'}, '待命'));
  const stopBtn = el('button', {className: 'stop-btn', id: 'stopBtn'}, '停止');
  stopBtn.style.display = 'none';
  th.appendChild(stopBtn);
  term.appendChild(th);
  const box = el('div', {className: 'console' + (compact ? ' console-sm' : '')});
  box.id = 'console';
  const h = getHistory()[currentCase ? currentCase.case_id : ''];
  if (h && h.log) {

  } else {

  }
  term.appendChild(box);
  return term;
}

async function loadSampleLog(c, result) {
  const body = $('#sampleLogBody'); if (!body) return;
  const scan = result.value_scan || {};
  const foundVals = Object.values(scan).filter(v => v && v.found).map(v => String(v.value)).filter(v => v && v.length >= 2);
  const hl = 'background:#264F78;color:#E6F0FA;border-radius:3px;padding:0 2px';
  try {
    const r = await fetch(`/api/case/${c.case_id}/events`);
    const events = r.ok ? await r.json() : [];
    const capOps = new Set(((result.match_stats && result.match_stats.capability_evidence) || []).map(e => e.operation));
    const sample = (c.program || '').toLowerCase();
    const hits = events.filter(e => capOps.has(e.operation) || (e.actor_name && e.actor_name.toLowerCase() === sample)).slice(0, 15);
    body.innerHTML = '';
    if (!hits.length) { body.appendChild(el('span', {className: 'dim'}, '没有命中的样本事件（IOA 未记录该行为）')); return; }

      let txt = escapeHtml(JSON.stringify(e, null, 2));
      for (const v of foundVals) {
        const ev = escapeHtml(v);
        txt = txt.split(ev).join('<mark style="' + hl + '">' + ev + '</mark>');

      const pre = el('pre', {style: 'margin:6px 0;padding:10px 14px;background:#0d0d12;border-radius:6px;font-size:12px;line-height:1.5;overflow-x:auto;white-space:pre-wrap;word-break:break-all;'});

      body.appendChild(pre);
    }

}

let stdoutText = '';
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderStdout(text, values, valueScan) {
  const pre = $('#codePre'); if (!pre) return;
  stdoutText = text || '';
  pre.innerHTML = '';
  const scan = valueScan || {};
  const lines = stdoutText.split('\n');
  const vals = (values || []).filter(v => v && String(v).length >= 2);
  for (const ln of lines) {
    const sp = el('span', {className: 'line'});
    let html = escapeHtml(ln);
    // [TARGET]/[SETUP] 行：样本自报字段值——日志里找到就标亮，没找到就标灰
    const mm = html.match(/^(\[(?:TARGET|SETUP)\]\s*)(.*)$/);
    if (mm) {
      const body = mm[2];
      const bodyHl = body.replace(/([A-Za-z_][A-Za-z0-9_]*)=([^ ]+)/g, (m, k, v) => {
        const rec = scan[k];
        const cls = (rec && rec.found) ? 'found' : 'miss';
        return k + '=<mark class="' + cls + '">' + v + '</mark>';
      });
      html = mm[1] + bodyHl;
    }
    sp.innerHTML = html;
    pre.appendChild(sp);
  }
  if (!lines.length) pre.appendChild(el('span', {className: 'dim'}, '暂无 stdout'));
}

async function loadStdout(c, path) {
  const pre = $('#codePre'); if (!pre) return;
  const url = path ? `/api/case/${c.case_id}/stdout?path=${encodeURIComponent(path)}` : `/api/case/${c.case_id}/stdout`;
  const r = await fetch(url);
  if (!r.ok) { renderStdout('', []); return; }
  const d = await r.json();

}

function streamTask(taskId, kind, taskCase, total) {
  setRunning(true);
  const box = $('#console');
  box.classList.remove('batch');   // 清掉上次批量的布局残留
  const ind0 = $('#runInd'); if (ind0) { ind0.className = 'run-ind running'; ind0.textContent = '运行中'; }
  const es = new EventSource(`/api/task/${taskId}/events`);
  activeStream = es;
  const stopBtn = $('#stopBtn');
  if (stopBtn) {
    stopBtn.style.display = '';
    stopBtn.onclick = () => {
      es.close();
      if (activeStream === es) activeStream = null;
      fetch(`/api/task/${taskId}/stop`, {method: 'POST'}).catch(() => {});
      const ind = $('#runInd'); if (ind) { ind.className = 'run-ind done'; ind.textContent = '已停止'; }
      stopBtn.style.display = 'none';
      setRunning(false);
    };
  }

  // ── 批量终端：每个 case 一张卡片，实时跳到正在跑的 case ──
  let batchMode = false;   // 出现第一个 ===CASE-BEGIN=== 后进入批量模式
  let batchCur = null;     // 当前 case id
  let curBlock = null;     // 当前 case 卡片
  const blocks = {};       // case_id -> {card, head, st, pre}
  const ended = new Set(); // 已收到 CASE-END 的 case
  let lastSave = 0;
  let progLabel = null, progFill = null;   // 批量进度条

  const mkCaseCard = (cid) => {
    if (blocks[cid]) return blocks[cid];
    const card = el('div', {className: 'batch-term'});
    const head = el('div', {className: 'batch-head'});
    head.appendChild(el('span', {className: 'batch-cid'}, caseCn(cid) + ' · ' + cid));
    const st = el('span', {className: 'batch-st running'}, '运行中…');
    head.appendChild(st);
    const pre = el('pre', {className: 'batch-pre'});
    card.append(head, pre);
    box.appendChild(card);
    const b = {card, head, st, pre};
    blocks[cid] = b;
    return b;
  };
  const activate = (cid) => {
    for (const k in blocks) blocks[k].card.classList.toggle('active', k === cid);
    const b = blocks[cid];
    if (b) {
      b.card.scrollIntoView({behavior: 'smooth', block: 'start'});
      markCaseRunning(cid);
    }
  };
  const push = (b, line, cls) => {
    const d = el('div', {className: cls || ''}, line);
    b.pre.appendChild(d);
    b.pre.scrollTop = b.pre.scrollHeight;
  };
  const saveCur = () => {
    if (batchCur && blocks[batchCur]) {
      const html = blocks[batchCur].pre.innerHTML;
      if (html) saveHistory(batchCur, 'run', html);
    }
  };

  es.onmessage = async (ev) => {
    const d = JSON.parse(ev.data);
    if (d.done) {
      es.close();
      if (activeStream === es) activeStream = null;
      const sb = $('#stopBtn'); if (sb) sb.style.display = 'none';
      const stopped = d.exit_code === -1;
      if (batchMode) {
        for (const k in blocks) {
          if (!ended.has(k)) {
            blocks[k].st.textContent = stopped ? '已停止' : '中断';
            blocks[k].st.className = 'batch-st fail';
          }
        }
        saveCur();
      } else {
        box.appendChild(el('div', {className: 'dim'}, stopped ? '── 已停止 ──' : '── 结束 exit_code=' + d.exit_code + ' ──'));
        box.scrollTop = box.scrollHeight;
      }
      if (currentCase && taskCase && currentCase.case_id === taskCase.case_id) {
        const ind = $('#runInd'); if (ind) { ind.className = 'run-ind done'; ind.textContent = stopped ? '已停止' : '完成'; }
      }
      setRunning(false);
      if (kind === 'match' && taskCase) await appendMatchLogic(taskCase);   // 匹配逻辑进终端
      if (!batchMode && taskCase) saveHistory(taskCase.case_id, kind || 'run', box.innerHTML);
      loadOverview(false);
      if (currentCase && taskCase && currentCase.case_id === taskCase.case_id && viewMode === 'match') refreshMatch(currentCase);
      return;
    }

    const line = d.line || '';
    const beginM = line.match(/^===CASE-BEGIN (.+)===$/);
    const endM = line.match(/^===CASE-END (.+?) rc=(-?\d+)===$/);
    if (beginM) {
      if (!batchMode) {
        batchMode = true; box.innerHTML = ''; box.classList.add('batch');
        const progWrap = el('div', {style: 'display:flex;align-items:center;gap:8px;margin:4px 0 10px;'});
        progLabel = el('span', {style: 'font-size:12px;color:#aaa;min-width:80px;'}, '0/' + (total || '?'));
        const progBar = el('div', {style: 'flex:1;height:6px;background:#2a2a2a;border-radius:3px;overflow:hidden;'});
        progFill = el('div', {style: 'height:100%;width:0%;background:#4caf50;transition:width .3s;'});
        progBar.appendChild(progFill);
        progWrap.append(progLabel, progBar);
        box.appendChild(progWrap);
      }
      saveCur();
      batchCur = beginM[1];
      curBlock = mkCaseCard(batchCur);
      activate(batchCur);
      push(curBlock, '── CASE BEGIN ──', 'dim');
      return;
    }
    if (endM) {
      const rc = parseInt(endM[2], 10);
      ended.add(endM[1]);
      if (curBlock) {
        const bin = caseBinaryOf(endM[1]);
        if (bin === '采集通过' || bin === '采集未通过') {
          curBlock.st.textContent = bin;
          curBlock.st.className = 'batch-st ' + (bin === '采集通过' ? 'ok' : 'fail');
        } else {
          curBlock.st.textContent = rc === 0 ? '完成' : '失败 rc=' + rc;
          curBlock.st.className = 'batch-st ' + (rc === 0 ? 'ok' : 'fail');
        }
        push(curBlock, '── CASE END rc=' + rc + ' ──', rc === 0 ? 'dim' : 'err');
        saveCur();
      }
      if (progLabel && progFill) {
        const done = ended.size;
        const pct = total ? Math.min(100, Math.round(done / total * 100)) : 0;
        progLabel.textContent = done + '/' + (total || '?') + '  ' + pct + '%';
        progFill.style.width = pct + '%';
      }
      batchCur = null; curBlock = null;
      return;
    }
    const cls = /ERROR|FAIL/.test(line) ? 'err' : (/WARN/.test(line) ? 'warn' : '');
    if (batchMode && curBlock) push(curBlock, line, cls);
    else { box.appendChild(el('div', {className: cls}, line)); box.scrollTop = box.scrollHeight; }
    // 单 case 运行实时落盘（批量模式按 case 分别落盘）
    const now = Date.now();
    if (taskCase && !batchMode && now - lastSave > 800) {
      lastSave = now;
      saveHistory(taskCase.case_id, kind || 'run', box.innerHTML);
    }
  };
  es.onerror = () => { if (activeStream === es) activeStream = null; es.close(); setRunning(false); };
}

/* 侧栏：把正在跑的 case 标为「运行中」 */
function markCaseRunning(cid) {
  const target = caseCn(cid);
  for (const it of $$('.case-item')) {
    const lab = it.querySelector('.label');
    if (!lab || lab.textContent !== target) continue;
    const st = it.querySelector('.case-status');
    if (st && (st.textContent === '待测' || st.textContent === '待匹配' || st.textContent === '待判定')) {
      st.textContent = '运行中';
      st.className = 'case-status running';
    }
  }
}

/* 匹配完成后：把匹配逻辑（v2能力/采集 + 漏斗 + 锚定链）追加到终端 */
async function appendMatchLogic(c) {
  const box = $('#console'); if (!box) return;
  try {
    const r = await fetch(`/api/case/${c.case_id}/result`);
    if (!r.ok) return;
    const res = await r.json();
    if (res.error) return;
    const card = el('div', {className: 'match-log'});
    card.appendChild(el('div', {className: 'match-log-head'}, '── 匹配逻辑 ──'));
    const ms = res.match_stats || {}; // v2 判定在 match_stats 嵌套层
    const capV2 = ms.capability_v2, colV2 = ms.collected_v2;
    if (capV2 || colV2) {
      card.appendChild(el('div', {}, '能力判定(v2): ' + (capV2 || '—') + ' ｜ 本次采集(v2): ' + (colV2 || '—')));
    }
    const rule = ms.capability_v2_rule || {};
    if (rule.anchor_type || (rule.operations || []).length) {
      card.appendChild(el('div', {}, '判定规则: 锚' + (rule.anchor_type || '—') + ' · 表 ' + (rule.tables || []).join('/') + ' · 操作 ' + (rule.operations || []).join('/')));
    }
    if (res.capability_detected !== undefined) {
      card.appendChild(el('div', {}, '能力矩阵(旧): ' + (res.capability_detected ? '采集通过' : '采集未通过')));
    }
    const st = res.match_stats;
    if (st) {
      card.appendChild(el('div', {}, '事件漏斗: ' + st.total_events + '→' + st.after_hostname + '→' + st.after_time + '→' + st.after_actor + '→' + st.after_pid + '→' + st.after_operation + '→' + st.candidate_count + ' 候选'));
      if (st.coverage_status) card.appendChild(el('div', {}, '日志覆盖: ' + st.coverage_status));
      if (Array.isArray(st.filter_log)) {
        card.appendChild(el('div', {className: 'dim'}, '── 锚定链 ──'));
        for (const l of st.filter_log.slice(0, 12)) card.appendChild(el('div', {className: 'dim'}, '  ' + l));
      }
    }
    if (res.anomaly) card.appendChild(el('div', {className: 'err'}, '⚠ ' + res.anomaly));
    box.appendChild(card);
    box.scrollTop = box.scrollHeight;
  } catch (e) {}
}

async function refreshMatch(c) {

    const r = await fetch(`/api/case/${c.case_id}/result`);
    if (r.ok) {
      const result = await r.json();
      renderCodeResult(c, result);
      const vals = (result.field_coverage || []).filter(f => f.status === 'PASS').map(f => f.actual_value).filter(Boolean);
      highlightStdout(vals, result.value_scan);
      loadSampleLog(c, result);
    }
  } catch (e) {}
}

/* 匹配摘要写进代码卡 header；代码主体=stdout；命中字段在代码里选中式高亮 */
function renderCodeResult(c, result) {
  const verdictEl = $('#codeVerdict'), statsEl = $('#codeStats'), msgEl = $('#codeMsg'), flPanel = $('#flPanel');
  if (!verdictEl) return;
  if (flPanel) flPanel.classList.add('open');
  if (!result || result.error) {
    verdictEl.textContent = '匹配结果：待运行';
    statsEl.textContent = '';
    msgEl.classList.remove('show');
    flPanel.innerHTML = '';
    return;
  }
  const cap = result.capability_detected;
  const anchor = result.anchor_detected;
  let capLabel;
  if (cap === true && anchor === true) capLabel = '确定采集';
  else if (cap === true && anchor === false) capLabel = '疑问：能力有、样本未锚定';
  else if (cap === false) capLabel = '确定不采集';
  else capLabel = '未判定';
  const ms = result.match_stats || {}; // v2 判定在 match_stats 嵌套层
  const capV2 = ms.capability_v2, colV2 = ms.collected_v2;
  if (capV2 || colV2) {
    verdictEl.textContent = '能力 ' + (capV2 || '—') + ' · 本次采集 ' + (colV2 || '—');
    verdictEl.className = 'code-verdict ' + (colV2 === '采到' ? 'v2-ok' : (colV2 === '未采到' ? 'v2-bad' : 'v2-wait'));
  } else {
    verdictEl.textContent = capLabel;
    verdictEl.className = 'code-verdict';
  }
  const r2 = ms.capability_v2_rule || {};
  const statsParts = [];
  if (r2.anchor_type) statsParts.push('锚定 ' + r2.anchor_type);
  if ((r2.tables || []).length) statsParts.push('表 ' + r2.tables.join('/'));
  if ((r2.operations || []).length) statsParts.push('操作 ' + r2.operations.join('/'));
  if (r2.anchor_process) statsParts.push('锚进程 ' + r2.anchor_process);
  const fc = result.field_coverage || [];
  const total = fc.length;
  const passed = fc.filter(f => f.status === 'PASS').length;
  statsEl.textContent = statsParts.join(' · ') || '';
  statsEl.title = '字段 ' + passed + '/' + total + ' · ' + capLabel + ' · 样本 ' + (result.sample_result || '—');

  if (result.message) { msgEl.textContent = result.message; msgEl.classList.add('show'); }
  else msgEl.classList.remove('show');

  flPanel.innerHTML = '';
  const st = result.match_stats;
  if (st) {
    flPanel.appendChild(el('div', {}, '事件漏斗：总 ' + st.total_events + ' → 主机 ' + st.after_hostname + ' → 时间窗 ' + st.after_time
      + ' → 进程 ' + st.after_actor + ' → PID ' + st.after_pid + ' → 操作 ' + st.after_operation + ' → 候选 ' + st.candidate_count));
    if (st.coverage_status) flPanel.appendChild(el('div', {}, '日志覆盖 ' + st.coverage_status));
  }
  const obs = result.observed_fields;
  if (obs) flPanel.appendChild(el('div', {}, '观察字段填充 ' + obs.filled + ' / ' + obs.total));
  if (result.anomaly) {
    flPanel.appendChild(el('div', {className: 'anomaly'}, '⚠ 异常采集现象：' + result.anomaly));
  }
  for (const f of fc.filter(x => x.status !== 'PASS')) {
    flPanel.appendChild(el('div', {}, f.field + ' = ' + (f.actual_value || '(空)') + '  [' + (f.status || 'FAIL') + ']'));
  }
  // 值命中：stdout [TARGET] 值是否出现在 IOA 日志里（stdout 值 → 日志证据）
  const vs = result.value_scan || {};
  const vsKeys = Object.keys(vs);
  if (vsKeys.length) {
    flPanel.appendChild(el('div', {}, '── 值命中（stdout → 日志）──'));
    for (const k of vsKeys) {
      const v = vs[k] || {};
      const hit = !!v.found;
      flPanel.appendChild(el('div', {className: hit ? '' : 'anomaly'},
        (hit ? '✓ ' : '✗ ') + k + ' = ' + (v.value || '(空)') +
        (hit && v.where && v.where.length ? '  @ ' + v.where.join(',') : '')));
    }
  }
  const fl = (result.match_stats && result.match_stats.filter_log) || [];
  if (fl.length) {
    flPanel.appendChild(el('div', {}, '── 匹配过程（锚定链） ──'));
    for (const l of fl) flPanel.appendChild(el('div', {}, l));
  }
}

/* 匹配日志确认：搜索栏式窄条，默认自动最新；面板可滚动/展开收起；无日志明确报错 */
function confirmLog() {
  return new Promise(async (resolve) => {
    const main = $('#main');
    if (!main || !currentCase) { resolve(null); return; }
    const wrap = el('div', {className: 'log-bar-wrap', id: 'logConfirm'});
    const bar = el('div', {className: 'log-bar'});
    let logs = [];
    try {
      const r = await fetch(`/api/case/${currentCase.case_id}/logs`);
      if (r.ok) logs = ((await r.json()).logs) || [];
    } catch (e) {}
    const anchor = main.querySelector('.panel-term, .panel-code');
    if (!anchor) { resolve(null); return; }
    main.insertBefore(wrap, anchor);

    const ts = (s) => { if (!s) return 0; const t = new Date(String(s).replace(' ', 'T')); return isNaN(t.getTime()) ? 0 : t.getTime(); };
    let chosen = null;
    const latest = logs[0];
    const ageH = latest && latest.mtime ? (Date.now() - ts(latest.mtime)) / 36e5 : 0;

    if (!logs.length) {
      bar.appendChild(el('span', {className: 'lt-value'}, '未找到 IOA 日志导出：请先在 IOA 控制台导出本模块日志到 log/<模块>/ 目录'));
      const cancel = el('button', {}, '知道了');
      cancel.onclick = () => wrap.remove();
      bar.appendChild(cancel);
      wrap.appendChild(bar);
      resolve(null);
      return;
    }

    const trigger = el('div', {className: 'log-trigger'});
    const caret = el('span', {className: 'caret'});
    caret.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
    trigger.append(el('span', {className: 'lt-label'}, '匹配日志'), caret,
      el('span', {className: 'lt-value'}, latest ? latest.name : ''),
      el('span', {className: 'lt-time'}, latest && latest.mtime ? latest.mtime : ''));
    const startBtn = el('button', {className: 'primary'}, '开始匹配');
    startBtn.onclick = () => { selectedJson = chosen; wrap.remove(); resolve(true); };
    const cancelBtn = el('button', {}, '取消');
    cancelBtn.onclick = () => { wrap.remove(); resolve(null); };
    bar.append(trigger, startBtn, cancelBtn);
    wrap.appendChild(bar);

    const panel = el('div', {className: 'log-panel'});
    if (ageH > 24) {
      panel.appendChild(el('div', {className: 'log-err'}, '注意：最新日志已导出超过 ' + Math.round(ageH) + ' 小时，可能过期。若刚导出了新日志，请确认已保存到 log/<模块>/ 后再匹配。'));
    }
    for (const lg of logs) {
      const row = el('div', {className: 'log-row'});
      const lab = el('label');
      const rb = el('input', {type: 'radio', name: 'logpick', checked: lg === latest});
      rb.onchange = () => {
        chosen = lg.path;
        trigger.querySelector('.lt-value').textContent = lg.name;
        trigger.querySelector('.lt-time').textContent = lg.mtime || '';
      };
      lab.appendChild(rb); lab.appendChild(document.createTextNode(lg.name));
      row.appendChild(lab);
      if (lg.mtime) row.appendChild(el('span', {className: 'time'}, lg.mtime));
      panel.appendChild(row);
    }
    wrap.appendChild(panel);
    trigger.onclick = () => { panel.classList.toggle('open'); caret.classList.toggle('open'); };
  });
}

function showSampleUpload() {
  if (!currentCase) return;
  const card = el('div', {className: 'card'});
  card.appendChild(el('h3', {}, '更新样本'));
  const inp = el('input', {type: 'file', multiple: true});
  const btn = el('button', {className: 'primary'}, '上传并更新哈希');
  const row = el('div', {className: 'upload-row'});
  btn.onclick = () => {
    if (!inp.files.length) return;
    const fd = new FormData();
    for (const f of inp.files) fd.append('file', f, f.name);
    fetch(`/api/case/${currentCase.case_id}/sample`, {method: 'POST', body: fd})
      .then(r => r.json())
      .then(d => { row.appendChild(el('span', {className: 'muted'}, d.error ? d.error : '已保存：' + (d.saved || []).join(', '))); loadOverview(); });
  };
  row.append(inp, btn); card.appendChild(row);
  $('#main').appendChild(card); card.scrollIntoView({behavior: 'smooth', block: 'start'});
}

/* 右键行为：查看样本文件名/更新时间 + 快捷更新样本 */
async function showCaseContext(x, y, c) {
  closeCtx();
  const menu = el('div', {className: 'ctx-menu open', id: 'ctxMenu'});
  menu.style.left = Math.min(x, window.innerWidth - 270) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - 260) + 'px';
  menu.appendChild(el('div', {className: 'ctx-title'}, caseCn(c.case_id) + ' · ' + c.case_id));
  const loadRow = el('div', {className: 'ctx-row'});
  loadRow.appendChild(el('span', {className: 'k'}, '样本'));
  loadRow.appendChild(el('span', {className: 'v'}, '加载中…'));
  menu.appendChild(loadRow);
  if (c.integrated) {
    const up = el('div', {className: 'ctx-item'}, '更新样本…');
    up.onclick = () => { closeCtx(); showSampleUpload(); };
    menu.appendChild(up);
  }
  document.body.appendChild(menu);
  try {
    const r = await fetch(`/api/case/${c.case_id}/sampleinfo`);
    if (r.ok) {
      const d = await r.json();
      loadRow.querySelector('.v').textContent = d.sample ? d.sample.name : '（无样本文件）';
      if (d.sample) {
        const r1 = el('div', {className: 'ctx-row'});
        r1.appendChild(el('span', {className: 'k'}, '更新时间'));
        r1.appendChild(el('span', {className: 'v'}, d.sample.mtime));
        menu.insertBefore(r1, menu.lastChild);
        const r2 = el('div', {className: 'ctx-row'});
        r2.appendChild(el('span', {className: 'k'}, '大小'));
        r2.appendChild(el('span', {className: 'v'}, (d.sample.size / 1024).toFixed(1) + ' KB'));
        menu.insertBefore(r2, menu.lastChild);
      }
      for (const f of (d.support || [])) {
        const r3 = el('div', {className: 'ctx-row'});
        r3.appendChild(el('span', {className: 'k'}, '附属'));
        r3.appendChild(el('span', {className: 'v'}, f.name));
        menu.insertBefore(r3, menu.lastChild);
      }
    }
  } catch (e) {}
}
function closeCtx() { const m = $('#ctxMenu'); if (m) m.remove(); }
document.addEventListener('click', closeCtx);
document.addEventListener('scroll', closeCtx, true);

loadOverview();
</script>
