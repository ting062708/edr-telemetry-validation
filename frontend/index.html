<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDR 采集验证台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══ 顶栏 ═══ -->
<div class="topbar">
  <div class="logo">
    <span class="mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="#fff" stroke-width="1.6"/><circle cx="12" cy="12" r="4" stroke="#fff" stroke-width="1.3" opacity=".6"/><circle cx="12" cy="12" r="1.5" fill="#fff"/><line x1="12" y1="12" x2="18" y2="6.5" stroke="#fff" stroke-width="1.6"/></svg></span>
    EDR 采集验证<span class="ver">v3.1</span>
  </div>
  <div class="snap"><span class="dot"></span>快照 <b style="color:var(--text)" id="snap-val">—</b></div>
  <div class="spacer"></div>

  <!-- 视图入口组 -->
  <button class="btn manual" id="btn-manual">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
    使用手册<span class="kbd">F1</span>
  </button>
  <button class="btn view" id="btn-baseline">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 3 5-6"/></svg>
    Baseline 对比
  </button>
  <button class="btn view" id="btn-report">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg>
    总结报告
  </button>
  <div class="sep"></div>

  <!-- 操作组 -->
  <button class="btn" id="btn-import-log">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
    导入日志
  </button>
  <button class="btn" id="btn-match-all">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>
    全量匹配
  </button>
  <button class="btn primary" id="btn-run-all">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>
    全量投递
  </button>
</div>

<!-- ═══ 主体 ═══ -->
<div class="main">
  <div class="sidebar" id="sidebar"></div>

  <div class="content">
    <div class="matrix-wrap" id="matrix-wrap">
      <div class="statstrip" id="statstrip"></div>
      <div id="modules"><div class="loading">加载中…</div></div>
    </div>

    <!-- 终端：拖拽条 + 可调高度 + 最大化 -->
    <div class="terminal" id="terminal">
      <div class="term-drag" id="term-drag" title="拖动调整终端高度"></div>
      <div class="term-bar" id="term-bar">
        <span class="dot idle" id="term-dot"></span>
        <span style="color:#97a0b4">终端</span>
        <span class="last" id="term-last"></span>
        <span class="tbtn" id="btn-term-max" title="最大化 / 还原（Esc 还原）">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          最大化
        </span>
        <span class="tbtn" id="btn-term-clear">清空</span>
        <span class="tbtn" id="btn-term-stop">停止</span>
        <span class="tbtn" id="term-arrow">▸</span>
      </div>
      <div class="term-body" id="term"></div>
    </div>
  </div>
</div>

<!-- ═══ 遮罩 ═══ -->
<div class="mask" id="mask" onclick="closeAll()"></div>

<!-- ═══ 详情抽屉 ═══ -->
<div class="slide" id="drawer">
  <div class="slide-head">
    <span class="title" id="d-title" style="font-family:var(--mono)"></span>
    <span class="sub" id="d-sub"></span>
    <span id="d-badge"></span>
    <span class="close" onclick="closeAll()">✕</span>
  </div>
  <div class="tabs" id="d-tabs"></div>
  <div class="slide-body" id="d-body"></div>
  <div class="slide-foot" id="d-foot">
    <button class="btn primary" id="d-run">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>跑样本
    </button>
    <button class="btn" id="d-match">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>匹配
    </button>
  </div>
</div>

<!-- ═══ 使用手册面板 ═══ -->
<div class="slide" id="panel-manual">
  <div class="slide-head" style="color:var(--manual)">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
    <span class="title">使用手册</span>
    <span class="close" onclick="closeAll()">✕</span>
  </div>
  <div class="slide-body md-block" id="manual-body"><div class="loading">加载中…</div></div>
</div>

<!-- ═══ Baseline 对比面板 ═══ -->
<div class="slide" id="panel-baseline">
  <div class="slide-head">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 3 5-6"/></svg>
    <span class="title">Baseline 对比</span>
    <span class="sub">当前结果 vs 行业基线 / 同学基线</span>
    <span class="close" onclick="closeAll()">✕</span>
  </div>
  <div class="slide-body">
    <div style="margin-bottom:14px">
      <div class="seg" id="baseline-seg">
        <button class="active" data-seg="industry">行业基线</button>
        <button data-seg="classmate">同学基线</button>
      </div>
    </div>
    <div id="baseline-body"><div class="loading">加载中…</div></div>
  </div>
</div>

<!-- ═══ 总结报告面板 ═══ -->
<div class="slide" id="panel-report">
  <div class="slide-head">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg>
    <span class="title">总结报告</span>
    <span class="sub">本轮回归整体结论</span>
    <span class="close" onclick="closeAll()">✕</span>
  </div>
  <div class="slide-body" id="report-body"><div class="loading">加载中…</div></div>
  <div class="slide-foot">
    <button class="btn primary" id="btn-export-md">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
      导出报告 Markdown
    </button>
    <button class="btn" id="btn-save-snap">存为本轮基线</button>
    <button class="btn" id="btn-report-refresh">刷新</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
